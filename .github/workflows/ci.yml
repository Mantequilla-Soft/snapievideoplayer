name: CI

on:
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (legacy scripts)
        run: npm run test:legacy

      - name: Test (Vitest, with coverage floor)
        run: npm run test:coverage

      - name: Build
        run: npm run build
